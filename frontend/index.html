<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Bot — chat with your docs</title>
<style>
  :root { --bg:#0F0F12; --card:#17171C; --accent:#7C5CFC; --text:#E8E8EC; --muted:#8A8A94; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:760px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .panel { background:var(--card); border:1px solid #26262E; border-radius:10px; padding:14px; margin-bottom:14px; }
  .chat { display:flex; flex-direction:column; gap:10px; }
  .msg { padding:10px 12px; border-radius:8px; background:#202027; font-size:14px; white-space:pre-wrap; }
  .msg.user { background:var(--accent); color:#fff; }
  .cites { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .chip { font-size:12px; background:#26262E; border:1px solid #33333D; color:var(--muted); border-radius:6px; padding:4px 8px; }
  .chip .score { color:var(--accent); }
  form { display:flex; gap:8px; }
  input, button { font:inherit; padding:10px; border-radius:8px; }
  input[type=text] { flex:1; background:#202027; border:1px solid #33333D; color:var(--text); }
  button { background:var(--accent); color:#fff; border:0; cursor:pointer; }
  .upload { display:flex; gap:8px; align-items:center; }
  .status { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Support Bot — answers from your own documents</h1>
  <div class="sub">Upload PDFs/TXT (SOPs, policies, FAQs) → ask questions → get cited answers with page numbers + relevance score.</div>

  <div class="panel">
    <form class="upload" id="uploadForm">
      <input type="file" id="file" accept=".pdf,.txt,.md" required>
      <button type="submit">Upload</button>
      <span class="status" id="uploadStatus"></span>
    </form>
  </div>

  <div class="panel">
    <div class="chat" id="chat"></div>
    <form id="askForm" style="margin-top:12px">
      <input type="text" id="question" placeholder="e.g. What is the refund window?" required>
      <button type="submit">Ask</button>
    </form>
  </div>
</div>
<script>
const chat = document.getElementById('chat');

// Auth: the API key is never embedded in the page. If the server requires it,
// the first protected call returns 401, we prompt once, and keep it in
// sessionStorage for the session. No key is written to disk or logged.
let apiKey = sessionStorage.getItem('rag_api_key') || '';

function authHeaders() {
  return apiKey ? { Authorization: `Bearer ${apiKey}` } : {};
}

async function withAuthRetry(url, options) {
  const res = await fetch(url, { ...options, headers: { ...authHeaders(), ...(options.headers || {}) } });
  if (res.status === 401) {
    const entered = window.prompt('This bot is protected. Enter the API key:');
    if (entered) {
      apiKey = entered;
      sessionStorage.setItem('rag_api_key', apiKey);
      return fetch(url, { ...options, headers: { ...authHeaders(), ...(options.headers || {}) } });
    }
  }
  return res;
}

function addMsg(text, isUser) {
  const d = document.createElement('div');
  d.className = 'msg' + (isUser ? ' user' : '');
  d.textContent = text;
  chat.appendChild(d);
  return d;
}

function addCites(container, cites) {
  if (!cites || !cites.length) return;
  const c = document.createElement('div');
  c.className = 'cites';
  for (const h of cites) {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = `${h.source}${h.page ? ' · p.' + h.page : ''} · <span class="score">${h.score.toFixed(3)}</span>`;
    chip.title = h.text;
    c.appendChild(chip);
  }
  container.appendChild(c);
}

document.getElementById('uploadForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = document.getElementById('file').files[0];
  const fd = new FormData(); fd.append('file', f);
  const r = await withAuthRetry('/documents/upload', { method: 'POST', body: fd });
  const j = await r.json();
  document.getElementById('uploadStatus').textContent =
    r.ok ? `Indexed ${j.filename} (${j.chunks} chunks)` : 'Upload failed: ' + (j.error || r.status);
});

document.getElementById('askForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = document.getElementById('question').value.trim();
  if (!q) return;
  addMsg(q, true);
  const msg = addMsg('Thinking…', false);
  try {
    const res = await withAuthRetry('/query/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q })
    });
    let answer = '';
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value);
      const lines = buf.split('\n\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const evt = JSON.parse(line.slice(6));
        if (evt.type === 'citations') addCites(msg, evt.citations);
        else if (evt.type === 'token') { answer += evt.text; msg.textContent = answer; }
      }
    }
    if (!answer) msg.textContent = 'No answer returned.';
  } catch (err) {
    msg.textContent = 'Error: ' + err.message;
  }
  document.getElementById('question').value = '';
});
</script>
</body>
</html>
